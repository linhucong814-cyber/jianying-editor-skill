name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      LINT_FILES: >-
        scripts/api_validator.py scripts/asset_search.py scripts/auto_exporter.py
        scripts/build_cloud_music_library.py scripts/cloud_manager.py scripts/universal_tts.py
        scripts/utils/cli_protocol.py scripts/utils/config.py scripts/utils/errors.py
        scripts/utils/formatters.py scripts/utils/logging_utils.py tests/test_wrapper.py
        tools/check_repo_hygiene.py tools/validate_data_schema.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt ruff==0.17.5 black==26.10.1
      - name: Lint and format
        shell: bash
        run: |
          ruff check $LINT_FILES
          black --check $LINT_FILES
      - name: Unit tests
        env:
        JY_CLOUD_CACHE_DIR: ${{ runner.temp }}/jianying-cloud-cache
        run: python -m unittest discover -s tests -v
      - run: python tools/check_repo_hygiene.py
      - run: python tools/validate_data_schema.py
